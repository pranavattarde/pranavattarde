<svg width="100%" viewBox="0 0 900 14" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="chk" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#12161d"/>
      <rect width="7" height="7" fill="#2a3038"/>
      <rect x="7" y="7" width="7" height="7" fill="#2a3038"/>
    </pattern>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadeMask">
      <linearGradient id="fadeGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#000"/>
        <stop offset="10%" stop-color="#fff"/>
        <stop offset="90%" stop-color="#fff"/>
        <stop offset="100%" stop-color="#000"/>
      </linearGradient>
      <rect width="900" height="14" fill="url(#fadeGrad)"/>
    </mask>
  </defs>
  <g mask="url(#fadeMask)">
    <rect width="900" height="14" fill="url(#chk)"/>
    <rect width="220" height="14" fill="url(#sheen)">
      <animate attributeName="x" begin="0s" dur="4s" repeatCount="indefinite" values="-220;900"/>
    </rect>
  </g>
</svg>
