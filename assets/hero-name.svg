<svg width="100%" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0d12"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0f14"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0%" stop-color="#6FA9C2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6FA9C2" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6FA9C2" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="heroClip"><rect x="0" y="0" width="900" height="230" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#heroClip)">
    <rect x="0" y="0" width="900" height="230" fill="url(#hbg)"/>

    <!-- faint receding grid, horizon feel -->
    <g stroke="#1a2029" stroke-width="1">
      <line x1="0" y1="230" x2="450" y2="120"/>
      <line x1="90" y1="230" x2="470" y2="120"/>
      <line x1="900" y1="230" x2="450" y2="120"/>
      <line x1="810" y1="230" x2="430" y2="120"/>
      <line x1="270" y1="230" x2="500" y2="120"/>
      <line x1="630" y1="230" x2="400" y2="120"/>
      <line x1="0" y1="205" x2="900" y2="205" stroke-opacity="0.5"/>
      <line x1="60" y1="178" x2="840" y2="178" stroke-opacity="0.35"/>
      <line x1="140" y1="150" x2="760" y2="150" stroke-opacity="0.2"/>
    </g>

    <!-- drifting particles -->
    <g fill="#6FA9C2">
      <circle cx="120" cy="60" r="1.6" opacity="0.5"><animate attributeName="cy" begin="0s" dur="7s" repeatCount="indefinite" values="60;30;60"/><animate attributeName="opacity" begin="0s" dur="7s" repeatCount="indefinite" values="0.1;0.6;0.1"/></circle>
      <circle cx="230" cy="90" r="1.2" opacity="0.4"><animate attributeName="cy" begin="1s" dur="8s" repeatCount="indefinite" values="90;55;90"/><animate attributeName="opacity" begin="1s" dur="8s" repeatCount="indefinite" values="0.1;0.5;0.1"/></circle>
      <circle cx="700" cy="50" r="1.8" opacity="0.5"><animate attributeName="cy" begin="0.5s" dur="6.5s" repeatCount="indefinite" values="50;20;50"/><animate attributeName="opacity" begin="0.5s" dur="6.5s" repeatCount="indefinite" values="0.1;0.6;0.1"/></circle>
      <circle cx="780" cy="95" r="1.3" opacity="0.4"><animate attributeName="cy" begin="2s" dur="9s" repeatCount="indefinite" values="95;60;95"/><animate attributeName="opacity" begin="2s" dur="9s" repeatCount="indefinite" values="0.1;0.5;0.1"/></circle>
      <circle cx="450" cy="35" r="1.4" opacity="0.4"><animate attributeName="cy" begin="1.5s" dur="7.5s" repeatCount="indefinite" values="35;10;35"/><animate attributeName="opacity" begin="1.5s" dur="7.5s" repeatCount="indefinite" values="0.1;0.5;0.1"/></circle>
      <circle cx="60" cy="150" r="1.2" opacity="0.35"><animate attributeName="cy" begin="0.8s" dur="8.5s" repeatCount="indefinite" values="150;120;150"/><animate attributeName="opacity" begin="0.8s" dur="8.5s" repeatCount="indefinite" values="0.08;0.4;0.08"/></circle>
      <circle cx="850" cy="150" r="1.5" opacity="0.4"><animate attributeName="cy" begin="2.5s" dur="7s" repeatCount="indefinite" values="150;120;150"/><animate attributeName="opacity" begin="2.5s" dur="7s" repeatCount="indefinite" values="0.08;0.45;0.08"/></circle>
    </g>

    <!-- sweeping light band -->
    <rect x="-300" y="0" width="300" height="230" fill="url(#sweep)">
      <animate attributeName="x" begin="0s" dur="6s" repeatCount="indefinite" values="-300;900"/>
    </rect>

    <!-- big name, layered for depth -->
    <g text-anchor="middle">
      <text x="452" y="118" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="66" letter-spacing="2" fill="#6FA9C2" opacity="0.35" filter="url(#softGlow)">PRANAV ATTARDE</text>
      <text x="450" y="116" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="66" letter-spacing="2" fill="#f2f4f8">PRANAV ATTARDE</text>
    </g>

    <!-- accent line under name with shimmer -->
    <line x1="300" y1="150" x2="600" y2="150" stroke="#2a323d" stroke-width="1.5"/>
    <rect x="280" y="147" width="90" height="6" fill="#6FA9C2" opacity="0.55">
      <animate attributeName="x" begin="0s" dur="4.5s" repeatCount="indefinite" values="280;530;280"/>
    </rect>

    <text x="450" y="182" text-anchor="middle" font-family="Consolas, monospace" font-size="15" letter-spacing="3" fill="#8b93a1">FULL-STACK ENGINEER · AI/ML</text>
  </g>
</svg>
